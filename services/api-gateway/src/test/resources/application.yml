server:
  port: 0

spring:
  application:
    name: api-gateway-test
  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        response-timeout: 2s
      routes:
        - id: auth-test-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: passenger-test-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/passengers/**
        - id: driver-test-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/drivers/**
        - id: ride-test-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/rides/**
        - id: matching-test-route
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/matching/**
        - id: pricing-test-route
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/pricing/**
        - id: billing-test-route
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/billing/**
        - id: notification-test-route
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/notifications/**
        - id: rating-test-route
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/ratings/**
        - id: reporting-test-route
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/reporting/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
